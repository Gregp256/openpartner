<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Theme bootstrap: resolve the System / Light / Dark preference and set
      <html data-theme> before first paint so the page never flashes the
      wrong palette. Mirrors src/lib/theme-preference.ts (localStorage key
      "op-theme"; anything else = follow the OS). Inline on purpose: no
      Content-Security-Policy restricts scripts on the portal HTML (nginx
      sends only frame-ancestors, the App Platform static site and Caddy
      send none; helmet only wraps the API). If script-src is ever added,
      allow this block by hash rather than moving it to an external file:
      nginx caches every .js for a year as immutable.
    -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var p = window.localStorage.getItem('op-theme');
          if (p === 'light' || p === 'dark') t = p;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) {
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
          } catch (e2) {}
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <title>Truest Affiliate</title>
    <script>
      (function () {
        var host = location.hostname.toLowerCase();
        var title = host.indexOf('aifluxx') >= 0 ? 'AIfluxx Affiliate' : host.indexOf('truest') >= 0 ? 'Truest Affiliate' : 'Affiliate';
        document.title = title;
        var og = document.querySelector('meta[property="og:title"]');
        if (og) og.setAttribute('content', title);
        // Brand favicon before the app boots, so the tab never shows the
        // platform mark on the affiliate hosts.
        var mark = host.indexOf('aifluxx') >= 0 ? '/brand/aifluxx-icon-dark.svg' : host.indexOf('truest') >= 0 ? '/brand/truest-icon-dark.svg' : null;
        if (mark) {
          document.addEventListener('DOMContentLoaded', function () {
            var links = document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]');
            for (var i = 0; i < links.length; i++) links[i].parentNode.removeChild(links[i]);
            var l = document.createElement('link');
            l.rel = 'icon';
            l.type = 'image/svg+xml';
            l.href = mark;
            document.head.appendChild(l);
          });
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Truest Affiliate" />
    <meta property="og:image" content="/og-default.png" />
  </head>
  <body>
    <!-- Shown until React mounts, so a slow first load is never a blank page. -->
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font:14px system-ui,sans-serif;color:#808994">Loading…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
